<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Danh Sách Học Sinh Đạt Giải Môn Toán Cấp Tỉnh/TP</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}
body {
    background-color: #f5f5f5;
    padding: 20px;
}
.container {
    max-width: 1200px;
    margin: 0 auto;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,.1);
    padding: 20px;
}
.header {
    text-align: center;
    margin-bottom: 12px;
    padding-bottom: 0;
    border-bottom: none;
}
.header h1 {
    color: #2c3e50;
    margin-bottom: 15px;
}
.search-container {
    background: transparent;
    padding: 0;
    border: none;
    border-radius: 0;
    margin: 0 0 12px;
}
.search-box {
    display: flex;
    gap: 8px;
    flex-wrap: nowrap;
    align-items: stretch;
}
.search-input {
    flex: 1;
    min-width: 0;
    height: 40px;
    box-sizing: border-box;
    padding: 0 13px;
    border: 1px solid #d5dce5;
    border-radius: 6px;
    background: #fff;
    color: #334155;
    font-size: 14px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
}
.search-input:focus {
    border-color: #3498db;
    box-shadow: 0 0 0 2px rgba(52,152,219,.12);
}
.search-input::placeholder {
    color: #94a3b8;
}
.search-btn {
    flex-shrink: 0;
    height: 40px;
    padding: 0 16px;
    background: #2878c7;
    color: #fff;
    border: 1px solid #2878c7;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: background .2s;
}
.search-btn:hover {
    background: #2165a8;
}
.stats {
    background: #e8f4fc;
    padding: 10px 12px;
    border-radius: 6px;
    margin-bottom: 8px;
    text-align: center;
    font-weight: bold;
    color: #2c3e50;
}
.prize-stats {
    background: #fffaf0;
    padding: 8px 10px;
    border-radius: 6px;
    margin-bottom: 0;
    text-align: center;
    font-weight: 500;
    border: 1px solid #f1e3bd;
    color: #334155;
    line-height: 1.9;
}
.academic-year {
    color: #2c3e50;
    margin: 20px 0 12px;
    padding-bottom: 8px;
    border-bottom: 2px solid #3498db;
}
.table-container {
    overflow-x: auto;
    margin-bottom: 9px;
}
table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 20px;
}
th {
    background: #34495e;
    color: #fff;
    padding: 12px;
    text-align: center;
    font-weight: bold;
}
td {
    padding: 12px;
    border-bottom: 1px solid #ddd;
    text-align: center;
}
tr:hover {
    background: #f8f9fa;
}
.student-info {
    display: flex;
    flex-direction: column;
}
.student-name {
    font-weight: bold;
    color: #2c3e50;
    margin-bottom: 5px;
}
.student-details {
    color: #3498db;
    font-size: 12px;
    font-weight: bold;
}
.prize-badge {
    display: inline-block;
    padding: 3px 6px;
    border-radius: 3px;
    font-weight: bold;
    text-align: center;
    min-width: 60px;
}
.prize-1 { background: #ffd700; color: #000; }
.prize-2 { background: #e74c3c; color: #fff; }
.prize-3 { background: #cd7f32; color: #fff; }
.prize-kk { background: #c0c0c0; color: #000; }
.prize-stats .prize-badge {
    padding: 2px 7px;
    margin: 2px 3px;
    border-radius: 4px;
    font-size: 13px;
    min-width: 0;
    white-space: nowrap;
}
.no-results {
    text-align: center;
    padding: 40px;
    color: #7f8c8d;
    font-style: italic;
}
@media (max-width: 768px) {
    .container { padding: 10px; }
    th, td {
        padding: 8px 5px;
        font-size: 14px;
    }
    .header { margin-bottom: 8px; }
    .search-box { gap: 6px; }
}
@media (max-width: 480px) {
    body { padding: 8px; }
    .container { padding: 10px; }
    .header h1 { font-size: 20px; }
    th, td {

        font-size: 12px;

    .student-details { font-size: 10px; }
    .stats {

        font-size: 13px;

    .prize-stats {

        font-size: 13px;
        line-height: 2;

    .prize-stats .prize-badge {

        padding: 2px 5px;

    }
    .search-input {

        padding: 0 10px;
        font-size: 13px;
    }
    .search-btn {
        height: 38px;
        padding: 0 12px;
        font-size: 13px;
    }
    .search-container { margin-bottom: 10px; }
}
</style>

function calculatePrizeStats(students) {
    const stats = { nhat: 0, nhi: 0, ba: 0, kk: 0 };
    students.forEach(student => {
        switch (student.prize) {
            case 'Nhất': stats.nhat++; break;
            case 'Nhì': stats.nhi++; break;
            case 'Ba': stats.ba++; break;
            case 'KK': stats.kk++; break;
        }
    });
    return stats;
}

function displayPrizeStats(students) {
    const stats = calculatePrizeStats(students);
    const statsElement = document.getElementById('prizeStats');
    const parts = [];

    if (stats.nhat > 0) parts.push(`<span class="prize-badge prize-1">${stats.nhat} Nhất</span>`);
    if (stats.nhi > 0) parts.push(`<span class="prize-badge prize-2">${stats.nhi} Nhì</span>`);
    if (stats.ba > 0) parts.push(`<span class="prize-badge prize-3">${stats.ba} Ba</span>`);
    if (stats.kk > 0) parts.push(`<span class="prize-badge prize-kk">${stats.kk} KK</span>`);

    statsElement.innerHTML =
        `Trong <strong>${students.length} giải</strong>, có: ${parts.join(' ')}.`;
}

function getPrizeClass(prize) {
    switch (prize) {
        case 'Nhất': return 'prize-1';
        case 'Nhì': return 'prize-2';
        case 'Ba': return 'prize-3';
        case 'KK': return 'prize-kk';
        default: return '';
    }
}

function displayStudents(students = studentsData) {
    const container = document.getElementById('resultsContainer');
    const totalCount = document.getElementById('totalCount');

    totalCount.textContent = students.length;
    displayPrizeStats(students);

    if (students.length === 0) {
        container.innerHTML = '<div class="no-results">Không tìm thấy kết quả phù hợp</div>';
        return;
    }

    let html = '';
    const years = [...new Set(students.map(student => student.year))].sort();

    years.forEach(year => {
        const yearStudents = students.filter(student => student.year === year);
        html += `<h3 class="academic-year">Năm học ${year}</h3>`;
        html += '<div class="table-container"><table>';
        html += '<thead><tr><th>STT</th><th>Họ tên học sinh</th><th>Điểm</th><th>Giải</th></tr></thead>';
        html += '<tbody>';

        yearStudents.forEach(student => {
            const displayName = student.specialNote
                ? `${student.name} ${student.specialNote}`
                : student.name;

            html += `<tr>
                <td>${student.stt}</td>
                <td>
                    <div class="student-info">
                        <div class="student-name">${displayName}</div>
                        <div class="student-details">${student.gender}, sinh năm ${student.birthYear}, lớp ${student.class}</div>
                    </div>
                </td>
                <td>${student.score}</td>
                <td><span class="prize-badge ${getPrizeClass(student.prize)}">${student.prize}</span></td>
            </tr>`;
        });

        html += '</tbody></table></div>';
    });

    container.innerHTML = html;
}

function searchStudents() {
    const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();

    if (searchTerm === '') {
        displayStudents();
        return;
    }

    const filteredStudents = studentsData.filter(student =>
        student.name.toLowerCase().includes(searchTerm) ||
        student.teacher.toLowerCase().includes(searchTerm) ||
        student.class.toLowerCase().includes(searchTerm) ||
        student.prize.toLowerCase().includes(searchTerm) ||
        student.gender.toLowerCase().includes(searchTerm) ||
        student.birthYear.toString().includes(searchTerm)
    );

    displayStudents(filteredStudents);
}

document.getElementById('searchInput').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') searchStudents();
});

document.addEventListener('DOMContentLoaded', function () {
    displayStudents();
});
